name: SDK checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateivo_test
          POSTGRES_PASSWORD: fictional_ci_only
          POSTGRES_DB: gateivo_reference_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateivo_test -d gateivo_reference_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22.6.0', '24.x']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run demo
      - name: Check the existing HTTP-backend example
        run: node --test examples/http-backend/*.test.mjs
      - name: Exercise the fictional HTTP boundary over MCP
        run: node examples/http-backend/demo.mjs
      - name: Check authenticated reference (Node 24)
        if: matrix.node == '24.x'
        run: npm run test:workos
      - name: Exercise verified login through the HTTP credential lookup (Node 24)
        if: matrix.node == '24.x'
        run: node examples/http-backend/login-demo.mjs
      - name: Verify isolated authenticated reference (Node 24)
        if: matrix.node == '24.x'
        run: npm run verify:workos
      - name: Verify packaged connection with PostgreSQL
        env:
          GATEIVO_REFERENCE_TEST_DATABASE_URL: postgresql://gateivo_test:fictional_ci_only@127.0.0.1:5432/gateivo_reference_test
        run: npm run verify:workos:postgres
